<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essay</title>
    <link rel="stylesheet" href="../css/archive.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../js/archive.js"></script>
    <style>
        .container {
            max-width: 900px;
        }

        .meta {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        #document-container {
            background: transparent;
            min-height: 80vh;
        }

        /* Styles for PDF embedding */
        .pdf-embed {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            background: #fff;
        }

        /* Markdown fallback styles */
        #document-container > :not(.pdf-embed) {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 4rem 3rem;
        }

        #loading {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 4rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="essays.html">&larr; Back to Essays</a>
        </nav>
        
        <div id="header-container">
            <!-- Title and meta injected here -->
        </div>

        <div id="document-container">
            <div id="loading">Loading essay...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const filename = urlParams.get('file');

        const container = document.getElementById('document-container');

        if (!filename) {
            document.getElementById('loading').innerText = "No file specified.";
        } else {
            // First load the manifest to get the title and metadata
            loadCsv('../essays/manifest.csv', 'Filename', function (rows) {
                const row = rows.find(r => r.Filename === filename);
                if (!row) {
                    // Don't render an iframe for a file that isn't in the manifest.
                    document.getElementById('header-container').innerHTML = '<h1>Not found</h1>';
                    container.innerHTML =
                        '<p class="empty">No essay matches that link. ' +
                        '<a href="essays.html">Back to the essay list</a>.</p>';
                    return;
                }

                document.title = row.Title + " - Christopher Alexander Perez";
                document.getElementById('header-container').innerHTML = `
                    <h1>${esc(row.Title)}</h1>
                    <div class="meta">
                        ${esc(row.Author)} &middot; ${esc(row.Class)} &middot; ${esc(row.Professor)} &middot; ${esc(row.Date)}
                    </div>
                `;

                if (filename.toLowerCase().endsWith('.pdf')) {
                    container.innerHTML = `<iframe src="../essays/${encodeURIComponent(filename)}" class="pdf-embed" title="Essay PDF Document"></iframe>`;
                } else if (filename.toLowerCase().endsWith('.md')) {
                    fetch('../essays/' + encodeURIComponent(filename))
                        .then(response => response.text())
                        .then(text => {
                            marked.setOptions({ breaks: true, gfm: true });
                            let htmlContent = marked.parse(text);
                            htmlContent = htmlContent.replace(/\[\^(\d+)\]:/g, '<p class="footnote"><sup>$1</sup>');
                            htmlContent = htmlContent.replace(/\[\^(\d+)\]/g, '<sup>$1</sup>');
                            container.innerHTML = htmlContent;
                        });
                } else {
                    document.getElementById('loading').innerText = "Unsupported file format.";
                }
            }, container);
        }
    </script>
</body>
</html>
